name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Backend tests (PHP ${{ matrix.php }} / PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, curl, pdo_pgsql, pgsql, bcmath, gd, zip, intl, xml, ctype
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan jwt:secret --force --ansi

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do
            sleep 1
          done

      # phpunit.xml setzt DB_DATABASE=testing fest (siehe <php> Block) - die
      # testing-Datenbank existiert bereits als POSTGRES_DB des Service-
      # Containers. DB_CONNECTION/HOST/USERNAME/PASSWORD kommen hier aus der
      # CI-Umgebung, weil sie in phpunit.xml NICHT hart codiert sind (dort
      # nur DB_DATABASE), im Gegensatz zur lokalen Sail-Umgebung.
      - name: Run database migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan migrate --force

      # Pint-Check: NUR auf den von SPEC-02 berührten Verzeichnissen (tests/),
      # nicht repo-weit. Der Alt-Code (app/, database/, routes/ etc.) wurde vor
      # SPEC-02 nie mit Pint formatiert und hat vermutlich reichlich
      # Style-Abweichungen - das reihenweise Umformatieren gehört nicht in
      # dieses Ticket (SPEC-02 ist Tests/CI/Backup-Regression, kein
      # Code-Style-Sweep) und würde unnötig große, nicht-funktionale Diffs in
      # unbeteiligten Dateien erzeugen. Sobald der Rest des Repos aufgeräumt
      # ist, kann dieser Schritt auf das ganze Repo ausgeweitet werden.
      - name: Pint (code style) - tests/ only
        run: vendor/bin/pint --test tests/

      - name: Run test suite (incl. Backup-Roundtrip)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test

  build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (TS-Fehler brechen den Build)
        run: npm run build
